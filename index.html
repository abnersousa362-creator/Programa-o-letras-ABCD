LUIR</button></div><button class=btn style=background:#1b8a3d;color:#fff onclick=saveCurrent()>💾 SALVAR PROGRAMAÇÃO</button><button class=btn style=background:#00b050;color:#fff onclick=L()>💾 SALVAR ARQUIVO FINAL P/ GRUPO</button><div id=ll style=display:none;background:#fff8cc;padding:10px;margin-top:8px;border-radius:8px;font-size:10px></div><div class=hist><h3>📚 HISTÓRICO DE PROGRAMAÇÕES</h3><div style="font-size:9px;margin-bottom:7px">A programação atual é salva automaticamente neste navegador. Use <b>SALVAR NO HISTÓRICO</b> para criar uma versão que poderá ser recuperada depois.</div><button class=btn style="background:#ffde59;color:#0e3d4f" onclick=saveHistory()>📚 SALVAR NO HISTÓRICO</button><div id=historyList></div></div></div></div><script>let CFG={letra:"B",data:"",jornada:"18:00-06:00",sup:"Eniel Martins",enc:"Cristiano Celestino",tec1:"",tec2:""};let D=[];let editIdx=-1;const CURRENT_KEY="letraB_programacao_atual_v7";const HISTORY_KEY="letraB_historico_v7";function cloneData(){return JSON.parse(JSON.stringify({c:CFG,d:D}));}function persistCurrent(){try{localStorage.setItem(CURRENT_KEY,JSON.stringify(cloneData()));}catch(e){console.warn("Nao foi possivel salvar no navegador",e)}}function saveCurrent(silent=false){persistCurrent();if(!silent)showOk("PROGRAMAÇÃO SALVA NESTE NAVEGADOR!");}function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");}catch(e){return []}}function saveHistory(){if(D.length==0)return alert("Adicione pelo menos 1 equipamento antes de salvar no histórico!");persistCurrent();let h=getHistory();let now=new Date();let snap=cloneData();snap.id=Date.now();snap.savedAt=now.toISOString();snap.label=(CFG.data?CFG.data.split("-").reverse().join("/"):now.toLocaleDateString("pt-BR"))+" - "+CFG.jornada;snap.total=D.length;h.unshift(snap);if(h.length>100)h=h.slice(0,100);try{localStorage.setItem(HISTORY_KEY,JSON.stringify(h));renderHistory();showOk("PROGRAMAÇÃO SALVA NO HISTÓRICO!");}catch(e){alert("Não foi possível salvar o histórico neste navegador.")}}function loadCurrent(){try{let raw=localStorage.getItem(CURRENT_KEY);if(!raw)return false;let pack=JSON.parse(raw);if(pack.c)CFG=pack.c;if(Array.isArray(pack.d))D=pack.d;return true;}catch(e){return false}}function loadHistory(id){let h=getHistory(),item=h.find(x=>x.id==id);if(!item)return;if(!confirm("Carregar esta programação? A programação atual será substituída."))return;CFG=item.c;D=item.d||[];cfg_letra.value=CFG.letra||"B";cfg_data.value=CFG.data||"";cfg_jornada.value=CFG.jornada||"18:00-06:00";cfg_sup.value=CFG.sup||"";cfg_enc.value=CFG.enc||"";cfg_tec1.value=CFG.tec1||"";cfg_tec2.value=CFG.tec2||"";limparCampos();persistCurrent();R();showOk("PROGRAMAÇÃO DO HISTÓRICO CARREGADA!");window.scrollTo({top:0,behavior:"smooth"})}function deleteHistory(id){let h=getHistory();let item=h.find(x=>x.id==id);if(!item)return;if(!confirm("Excluir esta programação do histórico?"))return;h=h.filter(x=>x.id!=id);localStorage.setItem(HISTORY_KEY,JSON.stringify(h));renderHistory();showOk("REGISTRO EXCLUÍDO!")}function clearHistory(){if(!getHistory().length)return;if(!confirm("Apagar todo o histórico deste navegador?"))return;localStorage.removeItem(HISTORY_KEY);renderHistory();showOk("HISTÓRICO APAGADO!")}function renderHistory(){let el=document.getElementById("historyList");if(!el)return;let h=getHistory();if(!h.length){el.innerHTML='<div style="padding:8px;text-align:center;font-size:9px;color:#666">Nenhuma programação salva no histórico.</div>';return}el.innerHTML=h.map(x=>{let dt=new Date(x.savedAt);let quando=isNaN(dt)?"":dt.toLocaleString("pt-BR");return `<div class="histItem"><b>${x.label||"Programação"}</b><br>${x.total||0} equipamento(s) · salva em ${quando}<div class="histBtns"><button class="histLoad" onclick="loadHistory(${x.id})">CARREGAR</button><button class="histDel" onclick="deleteHistory(${x.id})">EXCLUIR</button><button class="histClear" onclick="clearHistory()">LIMPAR TUDO</button></div></div>`}).join("")}function upCab(){let dt=CFG.data?CFG.data.split("-").reverse().join("/"):new Date().toLocaleDateString('pt-BR');titulo.innerHTML=`PROGRAMACAO DIARIA - LETRA ${CFG.letra.toUpperCase()}`;let tecs="";if(CFG.tec1||CFG.tec2)tecs=`<br>TECNICOS: ${CFG.tec1} ${CFG.tec2?"/ "+CFG.tec2:""}`;cab.innerHTML=`DATA: ${dt} - ${CFG.jornada}<br>SUP: ${CFG.sup} - ENC: ${CFG.enc}${tecs}`;}function saveCfg(){CFG={letra:cfg_letra.value||"B",data:cfg_data.value||CFG.data,jornada:cfg_jornada.value,sup:cfg_sup.value,enc:cfg_enc.value,tec1:cfg_tec1.value,tec2:cfg_tec2.value};upCab();persistCurrent();showOk("CABEÇALHO ATUALIZADO!")}function showOk(t){ok.innerText=t;ok.style.display='block';setTimeout(()=>ok.style.display='none',2000)}function R(){upCab();let G={};D.forEach((x,i)=>{if(!G[x[2]])G[x[2]]=[];G[x[2]].push([x,i])});let h="";if(D.length==0)h="<div style=background:#fff8cc;padding:10px;text-align:center;border-radius:8px;font-size:11px>Quadro vazio - comece a adicionar os equipamentos</div>";for(let k in G){h+=`<div class=s><b>${k} (${G[k].length})</b>`;G[k].forEach(([e,i])=>{let c=e[3]=="MAN"?"#b92a2a":"#1b8a3d";let dc=e[6]=="SIM"?"#1b8a3d":"#b92a2a";h+=`<div class=l onclick=E(${i})><span style=color:${c}>● ${e[0]} ${e[1]}</span><span>${e[3]}</span><span><b>${e[4]}</b><br>${e[5]}</span><span style=background:${dc};color:#fff;padding:2px 3px;border-radius:3px>${e[6]=="SIM"?"SIM":"NAO"}</span><span>✏️</span></div>`});h+=`</div>`}p.innerHTML=h}function limparCampos(){ii.value="";oo.value="";rr.value="";aa.value="";dd.value="SIM";ss.value="EM OPERACAO";editIdx=-1;fTitle.innerHTML="➕ Adicionar Novo Equipamento:";bSave.innerHTML="SALVAR NO QUADRO";bSave.style.background="#0e3d4f";}function E(i){editIdx=i;let e=D[i];ii.value=e[0];oo.value=e[1];tt.value=e[2];ss.value=e[3]=="OP"?"EM OPERACAO":"EM MANUTENCAO";rr.value=e[4];aa.value=e[5];dd.value=e[6]||"SIM";fTitle.innerHTML=`✏️ EDITANDO: ${e[0]} - Altere e clique ATUALIZAR`;bSave.innerHTML=`ATUALIZAR ${e[0]}`;bSave.style.background="#b92a2a";window.scrollTo(0,document.body.scrollHeight)}function C(){limparCampos();showOk("CAMPOS LIMPOS!")}function A(){if(!ii.value.trim())return alert("Digite o ID do TRB");let o=[ii.value.toUpperCase().trim(),oo.value.trim(),tt.value,ss.value=="EM OPERACAO"?"OP":"MAN",rr.value.toUpperCase().trim(),aa.value.trim(),dd.value];if(editIdx>=0){D[editIdx]=o;showOk(`${o[0]} ATUALIZADO!`)}else{let j=D.findIndex(x=>x[0]==o[0]);if(j>=0){if(confirm(`${o[0]} já existe. Atualizar?`)){D[j]=o;showOk(`${o[0]} ATUALIZADO!`)}else return}else{D.push(o);showOk(`${o[0]} ADICIONADO!`)}}limparCampos();R();persistCurrent();ii.focus()}function X(){let id=editIdx>=0?D[editIdx][0]:ii.value.toUpperCase().trim();if(!id)return alert("Selecione um equipamento no quadro ou digite o ID para excluir");let j=D.findIndex(x=>x[0]==id);if(j>=0&&confirm(`Excluir ${id}?`)){D.splice(j,1);limparCampos();R();persistCurrent();showOk(`${id} EXCLUIDO`)}}function L(){
if(D.length==0)return alert("Adicione pelo menos 1 equipamento!");

/* Gera um PDF real diretamente no navegador, sem depender da tela de impressao. */
function pdfEscape(s){
  return String(s||"")
    .replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")
    .replace(/[^\x20-\x7E]/g,"");
}
function ascii(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\x20-\x7E]/g,"");
}
function wrap(text,max){
  text=ascii(text);
  if(!text)return [""];
  let words=text.split(/\s+/), out=[], line="";
  words.forEach(word=>{
    if((line+" "+word).trim().length<=max) line=(line+" "+word).trim();
    else { if(line)out.push(line); line=word; }
  });
  if(line)out.push(line);
  return out.length?out:[""];
}
function makePDF(){
  let pages=[], page=[], y=800;
  function newPage(){ if(page.length)pages.push(page); page=[]; y=800; }
  function text(s,x,yy,size,bold){
    page.push({t:ascii(s),x:x,y:yy,size:size||9,b:bold});
  }
  function line(x1,y1,x2,y2){
    page.push({line:[x1,y1,x2,y2]});
  }
  function header(){
    text("PROGRAMACAO DIARIA - LETRA "+CFG.letra.toUpperCase(),40,y,15,true); y-=22;
    let dt=CFG.data?CFG.data.split("-").reverse().join("/"):new Date().toLocaleDateString("pt-BR");
    text("DATA: "+dt+" - "+CFG.jornada,40,y,9,false); y-=13;
    text("SUP: "+(CFG.sup||"")+" - ENC: "+(CFG.enc||""),40,y,9,false); y-=13;
    if(CFG.tec1||CFG.tec2){text("TECNICOS: "+(CFG.tec1||"")+" "+(CFG.tec2?"/ "+CFG.tec2:""),40,y,9,false);y-=13;}
    line(40,y,555,y); y-=15;
  }
  header();

  let G={};
  D.forEach(e=>{if(!G[e[2]])G[e[2]]=[];G[e[2]].push(e);});

  for(let tipo in G){
    if(y<95){newPage();header();}
    text(tipo+" ("+G[tipo].length+")",40,y,11,true); y-=16;
    line(40,y,555,y); y-=14;

    // Colunas: equipamento/operador, status, regiao/atividade, diretriz
    text("EQUIPAMENTO / OPERADOR",40,y,7,true);
    text("STATUS",185,y,7,true);
    text("REGIAO / ATIVIDADE",275,y,7,true);
    text("DIRETRIZ",505,y,7,true);
    y-=11; line(40,y,555,y); y-=10;

    for(let e of G[tipo]){
      let equip=wrap(e[0]+" "+(e[1]||""),25);
      let info=wrap((e[4]||"")+" / "+(e[5]||""),35);
      let rows=Math.max(equip.length,info.length,1);
      let h=rows*11+5;
      if(y-h<45){newPage();header();text(tipo+" (contin.)",40,y,11,true);y-=16;}
      for(let r=0;r<rows;r++){
        if(equip[r])text(equip[r],40,y,7.5,r===0);
        if(r===0)text(e[3]=="MAN"?"EM MANUTENCAO":"EM OPERACAO",185,y,7.5,false);
        if(info[r])text(info[r],275,y,7.5,r===0);
        if(r===0)text(e[6]=="SIM"?"SIM":"NAO",510,y,7.5,true);
        y-=11;
      }
      line(40,y+3,555,y+3); y-=5;
    }
    y-=8;
  }

  if(y<45){newPage();header();}
  text("TOTAL DE EQUIPAMENTOS: "+D.length,40,y,8,true);

  if(page.length)pages.push(page);

  // Montagem do PDF
  let objects=[];
  function add(obj){objects.push(obj);return objects.length;}
  let catalog=add(""), pagesObj=add(""), font=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
  let pageNums=[];
  let contentNums=[];

  pages.forEach(pg=>{
    let stream="q\n";
    pg.forEach(o=>{
      if(o.line){
        stream+=o.line[0]+" "+o.line[1]+" m "+o.line[2]+" "+o.line[3]+" l S\n";
      }else{
        stream+="BT\n/F1 "+o.size+" Tf\n"+o.x+" "+o.y+" Td\n("+pdfEscape(o.t)+") Tj\nET\n";
      }
    });
    stream+="Q\n";
    let content=add("<< /Length "+stream.length+" >>\nstream\n"+stream+"endstream");
    contentNums.push(content);
    let p=add("");
    pageNums.push(p);
  });

  objects[catalog-1]="<< /Type /Catalog /Pages "+pagesObj+" 0 R >>";
  objects[pagesObj-1]="<< /Type /Pages /Kids ["+pageNums.map(n=>n+" 0 R").join(" ")+"] /Count "+pageNums.length+" >>";
  pageNums.forEach((n,i)=>{

  });

  let pdf="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n", offsets=[0];
  objects.forEach((obj,i)=>{
    offsets.push(pdf.length);

  });
  let xref=pdf.length;
  pdf+="xref\n0 "+(objects.length+1)+"\n0000000000 65535 f \n";
  for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(objects.length+1)+" /Root "+catalog+" 0 R >>\nstartxref\n"+xref+"\n%%EOF";

  let bytes=new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&255;
  return new Blob([bytes],{type:"application/pdf"});
}
